scan_topics:
  - name: /scan/code
    type: std_msgs/msg/String
    rate_hz: event
    description: "真实扫码事件（有效条码才发布）"
  - name: /scan/arm_next
    type: std_msgs/msg/Empty
    rate_hz: event
    description: "录包停止且读码流出现变化(NG/移开)后发布，允许下一次扫码置1"
  - name: /ros2recordstop
    type: std_msgs/msg/Empty
    rate_hz: event
    description: "录包停止；/scan/success 复位为 0"
  - name: /scan/success
    type: std_msgs/msg/Float32MultiArray
    rate_hz: 30
    description: "固定30Hz：未扫码0 -> 扫码1 -> 录包停止0 -> 新一次扫码1"
