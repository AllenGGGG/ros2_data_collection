output_dir: /home/fiveages/data/mcap_data/
default_qos_depth: 10

topics:
  # 默认使用 CompressedImage（Yerba JPEG 话题）进行采集。
  # 如需切回 raw Image，请将 topic 改为 /image_raw 并把 type 改为 sensor_msgs/msg/Image。
  - name: /camera_head/color/image_raw/compressed
    type: sensor_msgs/msg/CompressedImage
    qos_depth: 10
  - name: /camera_left_wrist/color/image_raw/compressed
    type: sensor_msgs/msg/CompressedImage
    qos_depth: 42
  - name: /camera_right_wrist/color/image_raw/compressed
    type: sensor_msgs/msg/CompressedImage
    qos_depth: 42
  - name: /joint_states
    type: sensor_msgs/msg/JointState
    qos_depth: 200
  - name: /left_current_pose
    type: geometry_msgs/msg/PoseStamped
    qos_depth: 200
  - name: /right_current_pose
    type: geometry_msgs/msg/PoseStamped
    qos_depth: 200
  - name: /left_current_target
    type: geometry_msgs/msg/PoseStamped
    qos_depth: 200
  - name: /right_current_target
    type: geometry_msgs/msg/PoseStamped
    qos_depth: 200
  - name: /left_gripper_controller/target_command
    type: std_msgs/msg/Int32
    qos_depth: 10
  - name: /right_gripper_controller/target_command
    type: std_msgs/msg/Int32
    qos_depth: 10
  - name: /xr/controller_state
    type: std_msgs/msg/Int32
    qos_depth: 10
  - name: /body_current_pose
    type: geometry_msgs/msg/PoseStamped
    qos_depth: 10
  - name: /left_hand_controller/target_command
    type: std_msgs/msg/Int32
    qos_depth: 10
  - name: /left_hand_controller/target_percent
    type: std_msgs/msg/Float64
    qos_depth: 10
  - name: /right_hand_controller/target_command
    type: std_msgs/msg/Int32
    qos_depth: 10
  - name: /right_hand_controller/target_percent
    type: std_msgs/msg/Float64
    qos_depth: 10
